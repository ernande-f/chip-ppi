<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CHIP IFFar</title>
    <link rel="stylesheet" href="../css/info-modal.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body,
        html {
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- LADO ESQUERDO (AMARELO) --- */
        .left-panel {
            flex: 1;
            width: 50%;
            background-color: #d99c3e;
            background-image: url('../assets/imagem_esquerda.png');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 50px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .left-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            position: relative;
            width: 100%;
        }

        .left-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .info-button {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            outline: none;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 2px solid #000;
            border-radius: 50%;
            font-family: serif;
            font-weight: bold;
            font-size: 20px;
            color: #000;
            line-height: 1;
        }

        .info-button:hover {
            transform: scale(1.1);
        }

        /* --- LADO DIREITO (BRANCO) --- */
        .right-side {
            background-color: #ffffff;
            width: 47%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            position: relative;
            overflow-y: auto;
        }

        .logo-iffar {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 100px;
        }

        .welcome-text {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .instruction-text {
            font-size: 14px;
            color: #555;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            background-color: #e9e9e9;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .btn-entrar {
            width: 180px;
            padding: 15px;
            background-color: #f7c36f;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 600;
            color: #8d621f;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .auth-separator {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin: 2px 0 14px 14px;
            color: #777;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .auth-separator::before,
        .auth-separator::after {
            content: '';
            height: 1px;
            flex: 1;
            background: #dedede;
        }

        .btn-institutional {
            width: 100%;
            padding: 13px 16px;
            border-radius: 8px;
            background: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .2s ease, color .2s ease;
        }

        .btn-institutional:hover,
        .btn-institutional[aria-expanded="true"] {
            background: #1f5535;
            color: #fff;
        }

        #formInstitutionalLogin {
            margin-top: 16px;
            padding: 18px;
            border: 1px solid #dce7df;
            border-radius: 8px;
            background: #f8fbf8;
        }

        .institutional-helper {
            margin-bottom: 15px;
            color: #3c5143;
            font-size: 12px;
            line-height: 1.45;
        }

        .provider-label {
            display: block;
            margin: 0 0 7px 2px;
            color: #3c5143;
            font-size: 12px;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd8cf;
            border-radius: 8px;
            background: #fff;
            color: #24352b;
            font-size: 15px;
        }

        .btn-institutional-submit {
            width: 100%;
            margin: 4px 0 0;
            background: #1f5535;
            color: #fff;
            font-size: 16px;
        }

        .footer-links {
            font-size: 14px;
            font-weight: 600;
            color: #000;
            line-height: 1.8;
        }

        .footer-links a {
            color: #000;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-panel {
                display: none;
            }

            .right-side {
                width: 100%;
                padding: 40px 20px;
            }
        }

        .btn-link {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            font-weight: 600;
            color: #000;
            text-decoration: underline;
            cursor: pointer;
            display: inline;
        }

        .btn-link:hover {
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <section class="left-panel">
            <header class="left-header">
                <h2>CHIP</h2>
                <button type="button" class="info-button" id="infoButton" title="Mais informações">
                    <span class="info-icon">i</span>
                </button>
            </header>
        </section>

        <div class="right-side">
            <img src="../assets/logo.iffar.png" alt="Logo IFFar" class="logo-iffar">

            <h1 class="welcome-text">Bom te ver novamente!</h1>
            <p class="instruction-text">Preencha os campos para acessar sua conta.</p>

            <form id="formLogin">
                <div class="input-group">
                    <input id="email" type="email" placeholder="E-mail" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>

            <div class="auth-separator" aria-hidden="true"><span>ou</span></div>

            <button
                type="button"
                id="toggleInstitutionalLogin"
                class="btn-institutional"
                aria-expanded="false"
                aria-controls="formInstitutionalLogin"
            >
                Entrar com conta institucional
            </button>

            <form id="formInstitutionalLogin" hidden>
                <p class="institutional-helper">Use seu CPF e senha do IFFar. Sua senha não é armazenada pelo CHIP.</p>
                <div class="input-group">
                    <input id="cpf" type="text" inputmode="numeric" placeholder="CPF" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <input id="senhaInstitucional" type="password" placeholder="Senha institucional" autocomplete="current-password" required>
                </div>
                <div class="input-group">
                    <label class="provider-label" for="tipoInstitucional">Método de autenticação</label>
                    <select id="tipoInstitucional" required>
                        <option value="L">LDAP</option>
                        <option value="S">SIGAA</option>
                    </select>
                </div>
                <button type="submit" class="btn-entrar btn-institutional-submit">Entrar com IFFar</button>
            </form>

            <div class="footer-links">
                <br>
                Não tem conta? <a href="/register" class="btn-link">Cadastrar-se</a><br>
                Esqueceu sua senha? <a href="/redefinir-senha" class="btn-link">Redefinir</a>
            </div>
        </div>
    </div>
    </div>

    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/info-modal.js"></script>
</body>

</html>
