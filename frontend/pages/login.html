<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CHIP IFFar</title>
    <link rel="stylesheet" href="/vendor/inter/inter.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/info-modal.css">
</head>

<body>

    <div class="container">
        <section class="left-panel">
            <header class="left-header">
                <h2>CHIP</h2>
                <button type="button" class="info-button" id="infoButton" title="Mais informações">
                    <span class="info-icon">i</span>
                </button>
            </header>
        </section>

        <div class="right-side">
            <img src="../assets/logo_iffar.png" alt="Logo IFFar" class="logo-iffar">

            <h1 class="welcome-text">Bom te ver novamente!</h1>
            <p class="instruction-text">Acesse com sua conta Google institucional.</p>
            <p id="loginError" role="alert" hidden>Não foi possível entrar. Use uma conta institucional autorizada ou tente novamente.</p>
            <a href="/api/auth/google" class="btn-entrar" style="display:block;text-align:center;text-decoration:none">Entrar com Google</a>
            <div class="footer-links">
                <a href="/pages/pagina-inicial.html">Consultar disponibilidade sem entrar</a>
            </div>
        </div>
    </div>

    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/info-modal.js"></script>
</body>

</html>
