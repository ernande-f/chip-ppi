<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - IFFar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/info-modal.css">
</head>
<body>

    <main class="container">
        
        <section class="left-panel">
            <header class="left-header">
                <h2>CHIP</h2>
                <button type="button" class="info-button" id="infoButton" title="Mais informações">
                    <span class="info-icon">i</span>
                </button>
            </header>
        </section>

        <section class="right-panel">
            
            <div class="logo-container">
                <img src="../assets/logo_iffar.png" alt="logo-iffar">
            </div>
            
            <div class="form-container">
                <h1>Cadastro</h1>
                
                <form id="formCadastro">
                    
                    <div id="passo1">
                        <div class="input-group">
                            <input type="text" placeholder="Nome completo" id="nome" minlength="3" maxlength="60" autocomplete="name" required>
                        </div>
                        
                        <div class="input-group">
                            <input type="email" placeholder="Email institucional" id="email" maxlength="60" autocomplete="email" required>
                        </div>

                        <div class="input-group">
                            <input type="text" placeholder="CPF" id="cpf" inputmode="numeric" autocomplete="off" required>
                        </div>
                        
                        <div class="action-row">
                            <button type="button" class="btn-submit" id="btnAvancar">Avançar</button>
                            <span class="step-indicator">1 de 2</span>
                        </div>
                    </div>

                    <div id="passo2" style="display: none;">
                        <div class="input-group">
                            <input type="password" placeholder="Senha" id="senha" minlength="6" maxlength="64" autocomplete="new-password" required>
                        </div>
                        
                        <div class="input-group">
                            <input type="password" placeholder="Confirmar senha" id="confirmar-senha" minlength="6" maxlength="64" autocomplete="new-password" required>
                        </div>
                        
                        <div class="action-row">
                            <button type="submit" class="btn-submit">Concluir</button>
                            <span class="step-indicator">2 de 2</span>
                        </div>
                    </div>

                    <div class="login-link">
                        Já tem conta? <a href="/login">Entrar</a>
                    </div>
                    
                </form>
            </div>
        </section>

    </main>

    <script type="module" src="../js/cadastro.js"></script>
    <script type="module" src="../js/info-modal.js"></script>

</body>
</html>
