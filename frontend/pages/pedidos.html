<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - CHIP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="../css/pedidos-tec.css">
</head>
<body>
    <div class="page-wrap">
        <header class="navbar">
            <a href="/">
                <img src="../assets/logo.png" alt="Logo CHIP" class="logo-img">
            </a>

            <div class="search-bar">
                <input type="search" placeholder="Pesquisar por usuário ou número do pedido...">
            </div>

            <div class="nav-links">
                <a href="/pedidos.html" class="nav-link-item">Pedidos</a>
                <img src="../assets/sino.png" alt="Notificações" class="sino-img">
                <a href="/perfil-tec.html" class="nav-link-item">
                    <div class="profile-pic">
                        <svg viewBox="0 0 24 24" fill="#c7c7c7"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                </a>
            </div>
        </header>

        <section class="page-header">
            <h1>Pedidos</h1>
            <p>Gerenciamento dos pedidos</p>
        </section>

        <hr class="header-divider">

        <section class="tabs-row">
            <button class="tab-button active" data-tab="solicitacoes">Solicitações de empréstimo</button>
            <button class="tab-button" data-tab="separacao">Para separação</button>
            <button class="tab-button" data-tab="retirada">Para retirada</button>
            <button class="tab-button" data-tab="devolucao">Para devolução</button>
            <button class="tab-button" data-tab="historico">Histórico</button>
        </section>

        <p class="tab-note" id="tabNote"></p>
        <section class="orders-grid" id="ordersGrid"></section>
    </div>

    <div class="modal-overlay" id="orderModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <button class="modal-close" id="modalClose" type="button" aria-label="Fechar">&times;</button>
            <h2 class="modal-title" id="modalTitle">Pedido</h2>
            <p class="modal-subtitle" id="modalSubtitle"></p>

            <p class="modal-section-title">Itens no pedido</p>
            <div class="items-table">
                <div class="items-head">
                    <span>Produto</span>
                    <span>Quantidade</span>
                </div>
                <div id="modalItems"></div>
            </div>

            <div class="user-info-box" id="modalUserInfo">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" fill="#c7c7c7"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div>
                    <h3 class="item-name" id="modalUserName"></h3>
                    <p class="user-email" id="modalUserEmail"></p>
                    <div class="user-role" id="modalUserRole"></div>
                </div>
            </div>

            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script type="module" src="../js/header-avatar.js"></script>
    <script type="module" src="../js/admin-orders.js"></script>
</body>
</html>
