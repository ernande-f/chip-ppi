<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - IFFar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/info-modal.css">
</head>
<body>

    <main class="container">
        
        <section class="left-panel">
            <header class="left-header">
                <h2>CHIP</h2>
                <button type="button" class="info-button" id="infoButton" title="Mais informações">
                    <span class="info-icon">i</span>
                </button>
            </header>
        </section>

        <section class="right-panel">
            
            <div class="logo-container">
                <img src="../assets/logo_iffar.png" alt="logo-iffar">
            </div>
            
            <div class="form-container">
                <h1>Nova senha</h1>
                <p>Defina sua nova senha para concluir a recuperação de acesso à sua conta.</p>
                
                <form id="resetPasswordForm">
                    
                    <div class="input-group">
                        <input type="password" placeholder="Nova senha" id="new-password" minlength="6" maxlength="64" autocomplete="new-password" required>
                        <i class="fa-solid fa-eye-slash toggle-password"></i>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" placeholder="Confirmar senha" id="confirm-password" minlength="6" maxlength="64" autocomplete="new-password" required>
                    </div>
                    
                    <button type="submit" class="btn-submit">Redefinir</button>
                    
                </form>
            </div>
        </section>

    </main>

    <script type="module" src="../js/reset-password.js"></script>
    <script type="module" src="../js/info-modal.js"></script>
</body>
</html>
