<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - CHIP IFFar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/info-modal.css">
</head>
<body>

    <div class="container">
        <section class="left-panel">
            <header class="left-header">
                <h2>CHIP</h2>
                <button type="button" class="info-button" id="infoButton" title="Mais informações">
                    <span class="info-icon">i</span>
                </button>
            </header>
        </section>

        <div class="right-side">
            <img src="../assets/logo_iffar.png" alt="Logo IFFar" class="logo-iffar">
            
            <a href="/login" class="back-arrow">&larr;</a>

            <h1 class="welcome-text">Redefina sua senha</h1>
            <p class="instruction-text">As instruções serão enviadas por email para você!</p>

            <form id="forgotPasswordForm">
                <input id="forgotPasswordEmail" type="email" placeholder="Email" required>
                <br>
                <button type="submit" class="btn-enviar">Enviar email</button>
            </form>

            <div class="footer-text">
                O email não chegou? <button id="resendForgotPassword" type="button" class="btn-link">Reenviar email</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/forgot-password.js"></script>
    <script type="module" src="../js/info-modal.js"></script>
</body>
</html>
