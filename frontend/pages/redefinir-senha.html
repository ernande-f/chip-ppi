<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - CHIP IFFar</title>
    <link rel="stylesheet" href="../css/info-modal.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- LADO ESQUERDO (AMARELO) --- */
        .left-panel {
            flex: 1;
            width: 50%;
            background-color: #d99c3e;
            background-image: url('../assets/imagem_esquerda.png');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 50px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .left-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            position: relative;
            width: 100%;
        }

        .left-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .info-button {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            outline: none;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 2px solid #000;
            border-radius: 50%;
            font-family: serif;
            font-weight: bold;
            font-size: 20px;
            color: #000;
            line-height: 1;
        }

        .info-button:hover {
            transform: scale(1.1);
        }

        /* --- LADO DIREITO --- */
        .right-side {
            background-color: #ffffff;
            width: 47%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            position: relative;
        }

        .logo-iffar {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 100px;
        }

        .back-arrow {
            color: #eeb04b;
            font-size: 24px;
            text-decoration: none;
            margin-bottom: 10px;
            display: block;
        }

        .welcome-text {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .instruction-text {
            font-size: 14px;
            color: #8d621f;
            font-weight: 600;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            background-color: #ededed;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .btn-enviar {
            width: 220px;
            padding: 15px;
            background-color: #f7c36f;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #8d621f;
            cursor: pointer;
            margin-bottom: 25px;
        }

        /* ESTILO DO BOTÃO QUE PARECE TEXTO */
        .footer-text {
            font-size: 14px;
            font-weight: 700;
            color: #000;
        }

        .btn-link {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            font-weight: 700;
            color: #000;
            text-decoration: underline;
            cursor: pointer;
            display: inline;
        }

        .btn-link:hover {
            color: #555;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .left-panel { display: none; }
            .right-side { width: 100%; padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <section class="left-panel">
            <header class="left-header">
                <h2>CHIP</h2>
                <button type="button" class="info-button" id="infoButton" title="Mais informações">
                    <span class="info-icon">i</span>
                </button>
            </header>
        </section>

        <div class="right-side">
            <img src="../assets/logo.iffar.png" alt="Logo IFFar" class="logo-iffar">
            
            <a href="/login" class="back-arrow">&larr;</a>

            <h1 class="welcome-text">Redefina sua senha</h1>
            <p class="instruction-text">As instruções serão enviadas por email para você!</p>

            <form id="forgotPasswordForm">
                <input id="forgotPasswordEmail" type="email" placeholder="Email" required>
                <br>
                <button type="submit" class="btn-enviar">Enviar email</button>
            </form>

            <div class="footer-text">
                O email não chegou? <button id="resendForgotPassword" type="button" class="btn-link">Reenviar email</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/forgot-password.js"></script>
    <script type="module" src="../js/info-modal.js"></script>
</body>
</html>
